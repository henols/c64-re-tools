name: Live

# The live suites with a real VICE on Linux, macOS and Windows. CI installs
# VICE itself; the product never does (it refuses by name with the remedy).
# The skill scripts run only in the Linux dev container, so only Linux gets
# ACME, dxa, c64run and Ghidra; on macOS and Windows their tests skip.
# c64-re-tools needs VICE 3.9 or later and supports the latest release:
# Linux runs in Debian 13, whose package is VICE 3.9, the minimum (Ubuntu
# 24.04 has 3.7.1). Windows and macOS (Homebrew), which run the latest release, are off for now.

# Off on push for now (2026-10-15): it runs only when started by hand.
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Test files to run (globs, space-separated); empty runs every test"
        required: false
        default: ""

# The c64_window tests open real VICE windows; CI has a display for them.
env:
  C64RT_LIVE_WINDOW: "1"

# A newer push makes an older live run of the same branch pointless.
concurrency:
  group: live-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: live VICE (debian-13)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    steps:
      # Debian ships VICE without the Commodore ROMs; take them from VICE's own source tree.
      - name: Install VICE 3.9, Xvfb and the ROMs
        run: |
          # VICE is in contrib (its ROMs are not free software).
          sed -i "s/^Components: main$/Components: main contrib/" /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils procps vice xvfb xauth
          base=https://raw.githubusercontent.com/VICE-Team/svn-mirror/main/vice/data
          for root in /usr/share/vice "$HOME/.local/share/vice"; do
            mkdir -p "$root/C64" "$root/DRIVES"
            for rom in C64/kernal-901227-03.bin C64/basic-901226-01.bin C64/chargen-901225-01.bin DRIVES/dos1541-325302-01+901229-05.bin; do
              curl -fsSL -o "$root/$rom" "$base/$rom"
            done
          done
          echo "C64RT_LIVE_VICE=$(command -v x64sc)" >> "$GITHUB_ENV"
          x64sc -version || true

      - uses: actions/checkout@v4
      # The native tools of the skill scripts, as the dev container Feature installs them.
      - name: Install ACME, dxa, c64run and Ghidra
        run: |
          apt-get install -y --no-install-recommends openjdk-21-jdk-headless
          bash tools/install-container.sh
          echo "C64RT_GHIDRA=/opt/ghidra" >> "$GITHUB_ENV"
      # In a container, Node.js must come first: the pnpm installer runs on it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The c64_window tests need a display.
      - name: Live suites
        timeout-minutes: 20
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -n "$FILES" ]; then xvfb-run -a node --test $FILES; else xvfb-run -a pnpm test; fi

      - name: Processes left behind
        if: always()
        run: ps -A -o pid,ppid,etime,command | grep -E "x64sc|node" | grep -v grep || true

  other:
    name: live VICE (${{ matrix.os }})
    # Windows and macOS are off for now (2026-10-15); remove this line to run the job again.
    if: false
    strategy:
      fail-fast: false
      matrix:
        # macOS is off for now (2026-10-15): Homebrew's VICE 3.10 x64sc stops on -version, and the macOS job failed on it.
        # Its steps stay; add macos-latest here again to run it.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install VICE (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vice
          echo "C64RT_LIVE_VICE=$(brew --prefix)/bin/x64sc" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/x64sc" -version || true

      - name: Install VICE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vice.zip"
          Invoke-WebRequest -UserAgent "Wget" -Uri "https://sourceforge.net/projects/vice-emu/files/releases/binaries/windows/GTK3VICE-3.10-win64.zip/download" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vice"
          $bin = (Get-ChildItem -Path "$env:RUNNER_TEMP\vice" -Recurse -Filter x64sc.exe | Select-Object -First 1).DirectoryName
          "C64RT_LIVE_VICE=$bin\x64sc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      # macOS and Windows runners have a display for the c64_window tests. A step limit keeps the log of a hang.
      - name: Live suites
        if: runner.os == 'macOS'
        timeout-minutes: 20
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -n "$FILES" ]; then node --test $FILES; else pnpm test; fi

      # Windows VICE is slow under load on a 4-core runner: one test file at a time, so a monitor
      # answer never waits behind three other emulators.
      - name: Live suites (one file at a time)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: bash
        env:
          FILES: ${{ inputs.files }}
        run: |
          # --test-force-exit ends a file once its tests are done, so a teardown that hangs cannot lose the log;
          # the slow-stop lines and the next step still show it.
          if [ -n "$FILES" ]; then node --test --test-concurrency=1 --test-force-exit $FILES; else node --test --test-concurrency=1 --test-force-exit "src/**/*.test.ts" "test/**/*.test.ts"; fi

      - name: Processes left behind
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'x64sc|node' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List"; else ps -A -o pid,ppid,etime,command | grep -E "x64sc|node" | grep -v grep || true; fi
