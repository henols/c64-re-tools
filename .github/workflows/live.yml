name: Live

# The live suites with a real VICE on Linux, macOS and Windows. CI installs
# VICE itself; the product never does (it refuses by name with the remedy).
# c64-re-tools needs VICE 3.9 or later (D23): Linux runs in Debian 13, whose
# package is VICE 3.9 (Ubuntu 24.04 has 3.7.1).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      files:
        description: "Test files to run (globs, space-separated); empty runs every test"
        required: false
        default: ""

jobs:
  linux:
    name: live VICE (debian-13)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    steps:
      # Debian ships VICE without the Commodore ROMs; take them from VICE's own source tree.
      - name: Install VICE 3.9, Xvfb and the ROMs
        run: |
          # VICE is in contrib (its ROMs are not free software).
          sed -i "s/^Components: main$/Components: main contrib/" /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils procps vice xvfb xauth
          base=https://raw.githubusercontent.com/VICE-Team/svn-mirror/main/vice/data
          for root in /usr/share/vice "$HOME/.local/share/vice"; do
            mkdir -p "$root/C64" "$root/DRIVES"
            for rom in C64/kernal-901227-03.bin C64/basic-901226-01.bin C64/chargen-901225-01.bin DRIVES/dos1541-325302-01+901229-05.bin; do
              curl -fsSL -o "$root/$rom" "$base/$rom"
            done
          done
          echo "C64RT_LIVE_VICE=$(command -v x64sc)" >> "$GITHUB_ENV"
          x64sc -version || true

      # The native tools of the skill scripts: ACME from Debian, dxa 0.1.5 from its upstream source
      # (checked against its published MD5), Ghidra 12.1.3 with JDK 21.
      - name: Install ACME, dxa and Ghidra
        run: |
          apt-get install -y --no-install-recommends unzip build-essential acme openjdk-21-jdk-headless
          curl -fsSL -o /tmp/dxa.tgz https://www.floodgap.com/retrotech/xa/dists/dxa-0.1.5.tar.gz
          echo "6d69ae1772ed58de97b0180e480dfe0c  /tmp/dxa.tgz" | md5sum -c -
          tar -xzf /tmp/dxa.tgz -C /tmp
          make -C /tmp/dxa-0.1.5 CC=gcc
          install -m 0755 /tmp/dxa-0.1.5/dxa /usr/local/bin/dxa
          curl -fsSL -o /tmp/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          unzip -q /tmp/ghidra.zip -d /opt
          rm /tmp/ghidra.zip
          echo "C64RT_GHIDRA=/opt/ghidra_12.1.3_PUBLIC" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # In a container, Node.js must come first: the pnpm installer runs on it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The c64_window tests need a display.
      - name: Live suites
        timeout-minutes: 20
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -n "$FILES" ]; then xvfb-run -a node --test $FILES; else xvfb-run -a pnpm test; fi

  other:
    name: live VICE (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install VICE (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vice
          echo "C64RT_LIVE_VICE=$(brew --prefix)/bin/x64sc" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/x64sc" -version || true

      # The native tools of the skill scripts on macOS: ACME and JDK 21 from Homebrew, dxa 0.1.5 from its
      # upstream source, Ghidra 12.1.3.
      - name: Install ACME, dxa and Ghidra (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install acme openjdk@21 gradle
          jdk="$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home"
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/dxa.tgz" https://www.floodgap.com/retrotech/xa/dists/dxa-0.1.5.tar.gz
          test "$(md5 -q "$RUNNER_TEMP/dxa.tgz")" = 6d69ae1772ed58de97b0180e480dfe0c
          tar -xzf "$RUNNER_TEMP/dxa.tgz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/dxa-0.1.5" CC=clang
          mkdir -p "$HOME/bin" && install -m 0755 "$RUNNER_TEMP/dxa-0.1.5/dxa" "$HOME/bin/dxa"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$HOME"
          # Ghidra ships no native decompiler for macOS; its Gradle wrapper builds it (GettingStarted.md).
          (cd "$HOME/ghidra_12.1.3_PUBLIC/support/gradle" && JAVA_HOME="$jdk" PATH="$jdk/bin:$PATH" ./gradlew buildNatives)
          echo "C64RT_GHIDRA=$HOME/ghidra_12.1.3_PUBLIC" >> "$GITHUB_ENV"

      - name: Install VICE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vice.zip"
          Invoke-WebRequest -UserAgent "Wget" -Uri "https://sourceforge.net/projects/vice-emu/files/releases/binaries/windows/GTK3VICE-3.9-win64.zip/download" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vice"
          $bin = (Get-ChildItem -Path "$env:RUNNER_TEMP\vice" -Recurse -Filter x64sc.exe | Select-Object -First 1).DirectoryName
          "C64RT_LIVE_VICE=$bin\x64sc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      # The native tools on Windows: Ghidra 12.1.3 on the runner's JDK 21; dxa and ACME built with MinGW
      # from their sources. A tool that does not build stays missing, and its tests skip by name.
      - name: Install Ghidra, dxa and ACME (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -x
          # Unix-style paths: Git Bash tar reads "D:\\..." as a remote host.
          T="$(cygpath -u "$RUNNER_TEMP")"
          MAKE="$(command -v make || command -v mingw32-make)"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          curl -fsSL -o "$T/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          unzip -q "$T/ghidra.zip" -d "$T"
          echo "C64RT_GHIDRA=$(cygpath -w "$T/ghidra_12.1.3_PUBLIC")" >> "$GITHUB_ENV"
          mkdir -p "$T/bin"
          cygpath -w "$T/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$T/dxa.tgz" https://www.floodgap.com/retrotech/xa/dists/dxa-0.1.5.tar.gz
          tar -xzf "$T/dxa.tgz" -C "$T"
          # A build is installed only when it runs.
          "$MAKE" -C "$T/dxa-0.1.5" CC=gcc LDFLAGS=-static || true
          ls -la "$T/dxa-0.1.5" | grep -i dxa || true
          # dxa -h exits non-zero and names itself by its full path on Windows.
          out="$("$T/dxa-0.1.5/dxa.exe" -h 2>&1 || true)"; echo "dxa -h: $out"
          if echo "$out" | grep -q "v0.1.5 -- symbolic"; then cp "$T/dxa-0.1.5/dxa.exe" "$T/bin/"; else echo "dxa does not run"; fi
          git clone --depth 1 https://github.com/meonwax/acme.git "$T/acme" && "$MAKE" -C "$T/acme/src" CC=gcc LDFLAGS=-static || true
          ls -la "$T/acme/src" | grep -i "acme\b\|\.exe" || true
          out="$("$T/acme/src/acme.exe" --version 2>&1 || true)"; echo "acme --version: $out"
          if echo "$out" | grep -q "This is ACME"; then cp "$T/acme/src/acme.exe" "$T/bin/"; else echo "ACME does not run"; fi
          ls -la "$T/bin"

      # macOS and Windows runners have a display for the c64_window tests. A step limit keeps the log of a hang.
      - name: Live suites
        if: runner.os == 'macOS'
        timeout-minutes: 20
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -n "$FILES" ]; then node --test $FILES; else pnpm test; fi

      # Windows VICE is slow under load on a 4-core runner: one test file at a time, so a monitor
      # answer never waits behind three other emulators.
      - name: Live suites (one file at a time)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: bash
        env:
          FILES: ${{ inputs.files }}
        run: |
          # --test-force-exit ends a file once its tests are done, so a teardown that hangs cannot lose the log;
          # the slow-stop lines and the next step still show it.
          if [ -n "$FILES" ]; then node --test --test-concurrency=1 --test-force-exit $FILES; else node --test --test-concurrency=1 --test-force-exit "src/**/*.test.ts" "test/**/*.test.ts"; fi

      - name: Processes left behind
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'x64sc|node' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List"; else ps -A -o pid,ppid,etime,command | grep -E "x64sc|node" | grep -v grep || true; fi
