name: Dev container Feature

# Builds the c64-re-tools dev container Feature (D38) on the base images of
# devcontainer/test/c64-re-tools/scenarios.json and checks that every tool
# runs and that the toolkit is in the project. arm64 builds Ghidra's natives.
# Runs when the Feature changes, by hand, and before a release (ci.yml).

on:
  push:
    branches: [main]
    paths: ["devcontainer/**", ".github/workflows/devcontainer.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  feature:
    name: Feature (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test the Feature
        run: npx -y @devcontainers/cli features test --project-folder devcontainer --features c64-re-tools --skip-autogenerated
