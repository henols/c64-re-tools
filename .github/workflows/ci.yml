name: CI

# Tests every push to main and every pull request on ubuntu-latest. The
# tests for other systems run only when started by hand: Platforms (macOS,
# Windows), Dev container Feature and Live.
#
# A tag on a commit of main is a release, and the tag gives the version:
#   git tag v2.0.0-rc.2 && git push origin v2.0.0-rc.2   a prerelease, npm dist-tag next
#   git tag v2.0.0      && git push origin v2.0.0        a release, npm dist-tag latest
# A stable release can also be requested by changing .github/release-tag in a PR.
# Once merged and CI passes on main, CI creates the tag and explicitly dispatches
# its release workflow at that tag. GITHUB_TOKEN-created tags cannot trigger push
# workflows by themselves.
# A release tests nothing again: it needs the passed CI run of the push to
# main for the same commit, and waits for it if it still runs. Each job
# writes the tag's version into package.json and the plugin manifests
# inside the runner; nothing is pushed back. npm trusts this workflow file
# as the package's publisher (trusted publishing through OIDC), so no npm
# token is stored. A failed job is re-run alone: the publish and the GitHub
# Release skip what exists.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:
    branches: [main]
  # A dispatch targeted at a tag runs the same release jobs as a tag push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu-latest)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    # The tests take a few minutes; a test that hangs fails the run here, not after six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs every test. The live suites (real VICE and
      # the native tools) are opt-in and show as skipped, with their reason.
      - name: Test
        run: pnpm test

  installed:
    name: installed package (ubuntu-latest)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # npm publish drops a manifest field it finds invalid (bin paths that
      # start with ./) and only warns; npm pack keeps them, so the smoke test
      # below cannot see it. The dry run fails for a version that is already
      # published, so only its warning counts.
      - name: Check that npm publishes package.json unchanged
        run: |
          npm publish --dry-run --access public --tag next > "$RUNNER_TEMP/publish.log" 2>&1 || true
          if grep -q auto-corrected "$RUNNER_TEMP/publish.log"; then cat "$RUNNER_TEMP/publish.log"; exit 1; fi

      # The install route: the packed package through npx, as users run
      # the published one. No build, no links.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memory-map.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -qE 'c64-re-tools@(latest|next)"' .mcp.json
          node .claude/skills/c64-memory-map/scripts/memory-map.ts at '$d020' | grep -q EXTCOL

  # A changed release request on main creates a stable tag only after both CI
  # jobs pass. Dispatch the tag explicitly: a tag pushed with GITHUB_TOKEN does
  # not itself start a workflow run.
  stable-tag:
    name: tag requested stable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create refs/tags/vX.Y.Z
      actions: write  # dispatch this workflow at the new tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and start stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          request=.github/release-tag
          if ! git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$request" | grep -Fxq "$request"; then
            echo "No stable release requested by this push."
            exit 0
          fi

          tag="$(cat "$request")"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A stable release must use v<major>.<minor>.<patch>, got: $tag" >&2
            exit 1
          fi

          existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "$tag already points to $existing instead of $GITHUB_SHA; refusing to move it." >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            echo "Created $tag at $GITHUB_SHA."
          else
            echo "$tag already points to $GITHUB_SHA."
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 0
          fi
          gh workflow run ci.yml --ref "$tag"
          echo "Dispatched stable release workflow for $tag."

  # A release tag: the commit must be on main and its CI run must have passed.
  tested:
    name: tested on main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI run of the commit
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set the version of the release tag
        id: tag
        run: |
          node distribution/version.ts tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main. Tag a commit of main." >&2
            exit 1
          fi

      - name: Find the passed CI run of the commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run="$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run" ]; then
            echo "CI did not run on main for $GITHUB_SHA. Tag the commit that a push to main tested." >&2
            exit 1
          fi
          if ! gh run watch "$run" --exit-status --interval 10 > /dev/null; then
            echo "CI run $run on main for $GITHUB_SHA did not pass. Fix main, then tag the new commit." >&2
            exit 1
          fi
          echo "CI run $run on main for $GITHUB_SHA passed."

  publish:
    needs: [tested]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1 or later (trusted publishing)
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@latest
          fi
          npm --version

      - name: Publish
        run: |
          node distribution/version.ts tag "$GITHUB_REF_NAME"
          version="${{ needs.tested.outputs.version }}"
          if [ "$(npm view "@henols/c64-re-tools@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@henols/c64-re-tools@$version is on npm already."
          else
            npm publish --provenance --access public --tag "${{ needs.tested.outputs.channel }}"
          fi

  github-release:
    needs: [tested, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already."
          else
            prerelease=$([ "${{ needs.tested.outputs.channel }}" = next ] && echo --prerelease || true)
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          fi

      - uses: actions/checkout@v4

      # The dev container Feature, referenced by the https URL of this asset.
      # The spec wants the name devcontainer-feature-<id>.tgz. The Feature has
      # its own version, and the archive is the same bytes in every release
      # while its files stay the same: devcontainer-lock.json keeps its digest,
      # and a changed digest stops the build.
      - name: Attach the dev container Feature
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tar --sort=name --mtime="2026-01-01 00:00Z" --owner=0 --group=0 --numeric-owner -cf - -C devcontainer/src/c64-re-tools . | gzip -n > "$RUNNER_TEMP/devcontainer-feature-c64-re-tools.tgz"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/devcontainer-feature-c64-re-tools.tgz" --clobber
