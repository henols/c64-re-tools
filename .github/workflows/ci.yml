name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs every test. The live suites (real VICE, Ghidra and
      # the native tools) are opt-in and show as skipped, with their reason.
      - name: Test
        run: pnpm test

  installed:
    name: installed package (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The install route (D17): the packed package through npx, as users run
      # the published one. No build, no links.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/c64-emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memmap.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -q 'c64-re-tools@latest' .mcp.json
          node .claude/skills/c64-memory-map/scripts/memmap.ts at '$d020' | grep -q EXTCOL
          npx -y "$package" c64-re-tools status
