name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Path translation in the MCP tests reads these; on GitHub's runner the
# workspace IS the checkout dir, so CONTAINER_WORKSPACE_PATH must equal it.
# HOST_WORKSPACE_PATH is an arbitrary host-side mirror (the tests only need it
# set and consistent). The runner is non-root, so the read-only-deployment
# tests are enforced correctly here.
env:
  CONTAINER_WORKSPACE_PATH: ${{ github.workspace }}
  HOST_WORKSPACE_PATH: /host${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .claude/mcp/vice/package-lock.json

      - name: Install MCP server dependencies
        working-directory: .claude/mcp/vice
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: .claude/mcp/vice
        run: npm run typecheck

      - name: Test
        working-directory: .claude/mcp/vice
        run: npm test

      - name: Smoke-test the MCP server (boots under type-stripping + MCP handshake)
        working-directory: .claude/mcp/vice
        run: npm run smoke

      - name: Validate npm package contents
        run: node scripts/check-npm-packages.mjs

      - name: Build installable package
        run: bash scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64-re-tools-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    # On a v* tag, attach the built package to the GitHub Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build installable package
        run: bash scripts/package.sh
      - name: Publish release assets
        # Idempotent: create the release if it doesn't exist yet, otherwise just
        # attach/replace the assets. This lets a release be drafted by hand (or
        # by a re-run) without the job colliding with "release already exists".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.zip.sha256 --generate-notes --title "${GITHUB_REF_NAME}"
          fi

  publish-npm:
    # On a v* tag, publish both npm packages to the public registry.
    #
    # The published version is taken from the tag (v1.2.3 -> 1.2.3), so a release
    # can be cut just by pushing/creating a tag -- no need to pre-bump the source
    # package.json files to match. The committed versions are placeholders that
    # `npm version` overwrites here before publishing.
    #
    # Requires an automation token in the NPM_TOKEN repository secret; the
    # @henols scope must exist and the token must be allowed to publish it.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Publish the MCP server first: the installer depends on this exact version.
      - name: Publish @henols/vice-mcp
        working-directory: .claude/mcp/vice
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @henols/c64-re-tools
        working-directory: installer
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set "dependencies.@henols/vice-mcp=${{ steps.ver.outputs.version }}"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
