name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to npm (e.g. 0.1.5) -- no leading v. Publishes both packages via OIDC."
        required: true
        type: string

# Path translation in the MCP tests reads these; on GitHub's runner the
# workspace IS the checkout dir, so CONTAINER_WORKSPACE_PATH must equal it.
# HOST_WORKSPACE_PATH is an arbitrary host-side mirror (the tests only need it
# set and consistent). The runner is non-root, so the read-only-deployment
# tests are enforced correctly here.
env:
  CONTAINER_WORKSPACE_PATH: ${{ github.workspace }}
  HOST_WORKSPACE_PATH: /host${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Blocking: the audited-guard fate gate near the end of this job derives
      # its member set from the git object store at two pinned commits. The
      # default `actions/checkout@v4` clone is SHALLOW (depth 1) and contains
      # NEITHER of them, and that gate fails closed on a missing pinned object
      # rather than degrading to a smaller, quietly-correct-looking set -- so
      # this job needs full history. The other checkouts in this file belong to
      # jobs that do not run the gate and stay shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/mcp/vice/package-lock.json

      - name: Install MCP server dependencies
        working-directory: src/mcp/vice
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: src/mcp/vice
        run: npm run typecheck

      - name: Install ACME cross-assembler (DISASM-03 round-trip gate)
        # DISASM-03/criterion 4: the round-trip in disasm-roundtrip.test.ts
        # must run as a real gate, not silently skip. This step installs
        # ACME from the distribution archive (verified package name against
        # Debian trixie during planning: `acme`, "Multi-platform cross
        # assembler for 6502/6510/65816 CPU") and then PROVES the installed
        # binary really is ACME by running it and grepping its own banner --
        # `set -euo pipefail` plus the final grep make a wrong package name
        # or a broken install fail this job loudly, rather than letting the
        # Test step below silently skip the round-trip.
        #
        # timeout-minutes plus the retry_apt helper below exist because run
        # `32303212069` sat ~25 minutes stalled against an unresponsive apt
        # mirror with zero log output before it had to be cancelled by hand --
        # `build` gates `release`, `publish-npm` and `release-on-merge`, so an
        # unbounded stall here silently blocks every publish path. See the
        # closed todo .planning/todos/completed/2026-08-19-ci-acme-install-has-no-timeout-or-retry.md.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          retry_apt() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"; then
                return 0
              fi
              echo "retry_apt: attempt ${attempt}/3 failed for: apt-get $*" >&2
              sleep 5
            done
            echo "retry_apt: all 3 attempts failed for: apt-get $*" >&2
            return 1
          }
          retry_apt update
          retry_apt install -y acme
          command -v acme
          { acme --version || acme --help; } 2>&1 | head -5 | tee /tmp/acme-banner.txt
          grep -qi acme /tmp/acme-banner.txt

      - name: Assemble the acme-build scaffold (library-free)
        # The banner grep above only ever proved a binary named `acme` exists --
        # it never proved the scaffold this repo ships can actually be
        # assembled. `template.a` used to source <cbm/c64/vic.a> and friends,
        # and neither documented ACME provisioning route (a bare
        # ~/.local/bin/acme build, or the Debian trixie apt package installed
        # above) ships that library, so the scaffold could not assemble on
        # either route and nothing in CI noticed
        # (.planning/todos/pending/2026-08-19-acme-build-scaffold-library-missing-on-both-provisioning-routes.md).
        # This step scaffolds and assembles for real with $ACME explicitly
        # cleared, so a zero-byte or wrong-origin output -- or a regression
        # back to a library dependency -- fails the build.
        run: |
          set -euo pipefail
          SCAFFOLD="${RUNNER_TEMP}/acme-build-scaffold-check.a"
          rm -f "${SCAFFOLD}" "${SCAFFOLD%.a}.prg"
          ACME= node src/skills/acme-build/scripts/acme.mjs new "${SCAFFOLD}"
          ACME= node src/skills/acme-build/scripts/acme.mjs build "${SCAFFOLD}"
          PRG="${SCAFFOLD%.a}.prg"
          test -s "${PRG}"
          LOAD_BYTES=$(od -An -tx1 -N2 "${PRG}" | tr -d ' ')
          if [ "${LOAD_BYTES}" != "0108" ]; then
            echo "expected load address 01 08 (\$0801), got: ${LOAD_BYTES}" >&2
            exit 1
          fi
          echo "scaffold assembled: ${PRG} loads at \$0801"

      # Phase 31 gap closure (31-04, verification gap 1 / code review CR-01):
      # `installer/skills/` is a GENERATED, GITIGNORED tree -- `git ls-files
      # installer/skills` returns 0 -- and its ONE producer is
      # `installer/scripts/sync-skills.mjs`, the exact command the installer
      # package's own `prepack` hook runs. This step reuses that single
      # producer rather than introducing a second sync path.
      #
      # IT MUST STAY ORDERED BEFORE `Test`. The two steps further down that
      # also materialise the tree (`Validate npm package contents` via
      # check-npm-packages.mjs's packFiles(), and the removal gate) run AFTER
      # the suite and are therefore too late to help it. The specific defect
      # this closes: `src/mcp/vice/skill-attribution.test.ts` carries the one
      # guard in this repository that scores the two ABS-02 naming lines
      # across BOTH skill trees, and in CI the shipped tree did not exist when
      # it ran -- so it scored ONE tree and reported a clean pass with zero
      # skips, which is indistinguishable from having scored two.
      - name: Generate the shipped skills tree (scored by skill-attribution.test.ts)
        working-directory: installer
        run: node scripts/sync-skills.mjs

      - name: Test
        working-directory: src/mcp/vice
        env:
          # Second half of the loud-failure gate: with this set,
          # disasm-roundtrip.test.ts turns "ACME absent" from a named SKIP
          # into a hard FAIL. This step runs `npm test`, the full `*.test.*`
          # glob (not the narrower `npm run test:automated`), so the
          # round-trip runs here either way.
          #
          # `npm test` (not `npm run test:automated`) is DELIBERATE, decided
          # from run 32517575905 (2026-08-21, GitHub Actions, ubuntu-latest):
          # its own Test-step log shows every one of test-gate.mjs's
          # MANUAL_ONLY_TESTS entries (nine as of Phase 15 plan 15-10)
          # running to completion with zero failures in under two minutes
          # wall-clock, including the suite that provides the stdio proxy's
          # only end-to-end wire proof (BACK-05) and the two suites that hang
          # locally outside a devcontainer (see the closed todo this comment
          # replaces:
          # .planning/todos/completed/2026-08-13-reconcile-ci-test-command-with-narrowed-gate.md).
          # None of these suites needs a real emulator binary to reach its
          # own default-SKIP branch, so every one of them stays a no-op skip
          # on this runner even under the wide glob -- including the newest
          # entry, a checkpoint-flood probe against a real emulator, which is
          # opt-in behind its own environment variable that CI never sets.
          # CI's set is deliberately wider than `npm run test:automated`,
          # which exists for local/devcontainer ergonomics (avoiding the
          # local hang), not as CI's contract. `test-gate.test.ts`'s drift
          # guard remains the single source of truth for which files are
          # manual-only; this comment names no second list, deliberately
          # naming zero of them here.
          VICE_REQUIRE_ACME: "1"
        run: npm test

      - name: Smoke-test the MCP server (boots under type-stripping + MCP handshake)
        working-directory: src/mcp/vice
        run: npm run smoke

      # Phase 16 gap closure (16-08, code review WR-01): installer/wire-mcp.test.mjs
      # (18 tests) pins wireMcp(), the installer's only code that reads, edits and
      # rewrites a file it does not own (a consumer's .mcp.json), and was committed
      # this phase with nothing in CI executing it. No `npm ci` step is needed here
      # -- installer/bin/cli.mjs imports only node: builtins, so the suite runs
      # against a bare checkout.
      - name: Test the installer
        working-directory: installer
        run: npm test

      # Phase 16 gap closure (16-08, code review WR-01): the four skill suites under
      # src/skills/*/scripts/ (diff-images.test.mjs, d64-parse.test.mjs,
      # dump-artifacts.test.mjs, watch-loads.test.mjs; 95 tests, 87 pass, 8 skipped,
      # 0 fail measured at plan time) were likewise committed and executed by
      # nothing in CI -- the vice-mcp `npm test` glob above is cwd-only and
      # non-recursive, so it structurally cannot reach a suite outside its own
      # directory. These suites need no ACME and no emulator, so they add roughly
      # half a second to the job. The glob is quoted so Node receives the pattern
      # rather than a shell expansion.
      - name: Test the skills
        run: node --test 'src/skills/*/scripts/*.test.mjs'

      - name: Validate npm package contents
        run: node scripts/check-npm-packages.mjs

      # Blocking (CUT-02/CUT-03): the removal gate. It asserts the deleted
      # static-analysis integration is named nowhere this repository tracks or
      # ships, outside a dated allow-list and a set of exact-count, path- or
      # block-scoped exemptions for the licence, attribution and provenance
      # prose that legitimately keeps the name forever. It is deliberately in
      # CI from the wave BEFORE the deletion, because 4f048bb closed a
      # milestone with a guard already red and nothing forced anyone to notice.
      - name: Validate the removed integration stays removed (CUT-02/CUT-03)
        run: node scripts/check-no-regenerator2000.mjs

      # Blocking: a skill that documents a tool the active backend does not
      # advertise fails at runtime for the user with an unknown-tool error,
      # and the six skills are the product surface this milestone exists to
      # keep working (Phase 5 criterion 5).
      - name: Validate skill tool coverage against the stock manifest (Phase 5 criterion 5)
        run: node scripts/check-skill-tool-coverage.mjs

      # Blocking: a skill playbook naming a tool the active backend does not
      # advertise breaks a user's session with an unwarned refusal, and a
      # README that no longer tells a reader which VICE to install or which
      # tools require the fork silently reopens Phase 8's install-honesty
      # gap (DIST-02/DIST-03, SKILL-01).
      - name: Validate skill playbook and README backend-honesty (Phase 8)
        run: node scripts/check-skill-fork-honesty.mjs

      # Blocking: a skill's `description:` IS Claude Code's dispatch input,
      # so two descriptions contending for the same trigger fires the wrong
      # playbook and never the right one -- silently, with no error anywhere
      # (Phase 19, ABS-03). No other gate in this repository looks for it:
      # the two above ask whether a named tool exists and whether a fork
      # requirement is stated nearby, and neither has any opinion about two
      # skills competing for the same caller.
      - name: Validate skill description trigger uniqueness (Phase 19, ABS-03)
        run: node scripts/check-skill-description-overlap.mjs

      # Blocking (REPOINT-01/REPOINT-02): a documented `anno <verb>` command
      # whose ARGUMENTS are wrong runs, fails for the user, and passes every
      # gate above -- because the two skill gates beside it resolve NAMES and
      # never an invocation's arguments. That is the structural reason CR-04
      # (`render-memmap <a file the store opener refuses>`) and CR-05
      # (`coverage <a format with no producer left>`) both shipped green in
      # Phase 29 and were found only by driving the CLI by hand.
      - name: Validate documented anno CLI invocations argument-by-argument (REPOINT-01/02)
        run: node scripts/check-skill-cli-invocations.mjs

      # Blocking (CUT-04): the previous milestone re-pointed a large set of
      # guards off a subject it then deleted, and each move was proven
      # non-vacuous one guard at a time, at the commit that moved it. Nothing
      # swept the whole set afterwards. Without this gate a guard can silently
      # drop out of the audited set -- a vacuous guard asserts nothing and is
      # therefore GREEN, invisible to every other check here -- and the
      # recorded fate of every audited member decays into unenforced prose.
      # That is the 4f048bb failure mode: a milestone closed with a guard
      # already red and nothing forcing anyone to notice. It runs against the
      # full-history checkout at the top of this job, which the derivation
      # requires.
      - name: Validate every audited guard has a recorded, non-vacuous fate (CUT-04)
        run: node scripts/check-guard-fates.mjs

      - name: Build installable package
        run: bash scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64-re-tools-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    # On a v* tag, attach the built package to the GitHub Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp, package, and publish release assets
        # quick-260819-vie D-1: the three steps this job used to run inline
        # (stamp the manifests, build the zip, attach it to the release) now
        # live in ONE seam, scripts/release-assets.sh, called from both
        # release paths -- see that script's own header for the mechanism
        # (an ephemeral stamp commit inside a throwaway detached worktree,
        # never pushed) and for why: the merge path's GITHUB_TOKEN-created
        # tag never re-triggers this job, so v0.2.0 shipped with zero
        # release assets when these steps lived only here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release-assets.sh "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME}"

  publish-npm:
    # On a v* tag, publish both npm packages to the public registry via
    # npm Trusted Publishing (OIDC) -- no NPM_TOKEN secret required.
    #
    # The published version is taken from the tag (v1.2.3 -> 1.2.3), so a release
    # can be cut just by pushing/creating a tag -- no need to pre-bump the source
    # package.json files to match. The committed versions are placeholders that
    # `npm version` overwrites here before publishing.
    #
    # Prerequisite (one-time, on npmjs.com): each package must have a Trusted
    # Publisher configured for this repo + workflow (henols/c64-re-tools, ci.yml).
    # OIDC also requires npm >= 11.5.1, so npm is upgraded below (the runner's
    # bundled npm is older). Provenance attestations are produced automatically.
    needs: build
    # Runs on a v* tag push, or on a manual "Run workflow" (workflow_dispatch)
    # where the version is supplied as an input.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Derive version
        id: ver
        # From the workflow_dispatch input when triggered manually, otherwise
        # from the tag (v1.2.3 -> 1.2.3).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Publish the MCP server first: the installer depends on this exact version.
      # No NODE_AUTH_TOKEN: npm authenticates to the registry via GitHub OIDC.
      - name: Publish @henols/vice-mcp
        working-directory: src/mcp/vice
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish

      - name: Publish @henols/c64-re-tools
        working-directory: installer
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set "dependencies.@henols/vice-mcp=${{ steps.ver.outputs.version }}"
          npm publish

  release-on-merge:
    # Auto-release on every merge to main (a PR merge is a push to main):
    # bump the PATCH of the current published version and publish both packages
    # via OIDC, then create the matching tag + GitHub release.
    #
    # For a minor/major bump, use the manual "Run workflow" trigger with an
    # explicit version instead. To land a merge WITHOUT releasing, put the
    # skip marker in the commit SUBJECT (first line) -- see the gate step.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub release
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: gate
        # Only the commit SUBJECT (first line) is checked, so a PR body that
        # merely mentions the marker doesn't accidentally skip the release.
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s)"
          if printf '%s' "$SUBJECT" | grep -qiF '[skip release]'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Commit subject requests skip: $SUBJECT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        if: steps.gate.outputs.release == 'true'
        run: npm install -g npm@latest

      - name: Resolve version from the VERSION template
        id: ver
        if: steps.gate.outputs.release == 'true'
        # The repo-root VERSION template (quick-260819-tsz, D-1/D-2) is the
        # single source of truth for what gets published -- no more inline
        # npm-view-plus-patch-increment. scripts/version.mjs reads npm
        # READ-ONLY (`npm view`, to see what's actually published) and never
        # publishes, tags, or pushes anything itself; it writes
        # version=/published=/rule= into $GITHUB_OUTPUT, so
        # steps.ver.outputs.version keeps working unchanged for the two
        # publish steps below. It also exits non-zero if the resolved
        # version would not be strictly greater than published, turning a
        # downward hand-edit into a loud CI failure instead of a registry
        # 409 inside npm publish.
        run: |
          set -euo pipefail
          node scripts/version.mjs resolve --github-output

      - name: Publish @henols/vice-mcp
        if: steps.gate.outputs.release == 'true'
        working-directory: src/mcp/vice
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish

      - name: Publish @henols/c64-re-tools
        if: steps.gate.outputs.release == 'true'
        working-directory: installer
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set "dependencies.@henols/vice-mcp=${{ steps.ver.outputs.version }}"
          npm publish

      - name: Create tag + GitHub release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag is created at this merge commit by the GITHUB_TOKEN, which by
        # design does NOT re-trigger the tag-push workflow (no double publish).
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.version }}"
          gh release create "$TAG" --target "${{ github.sha }}" --generate-notes --title "$TAG"

      - name: Publish release assets
        # quick-260819-vie D-1: this is the row the merge path used to skip
        # entirely. This job creates the tag above with GITHUB_TOKEN, which
        # by design does NOT re-trigger the tag-push workflow (see the
        # comment on "Create tag + GitHub release"), so the `release` job
        # can never run on this path -- v0.2.0 shipped with zero release
        # assets as a direct result. Ordering is load-bearing: this step
        # runs AFTER `gh release create`, so the release always exists by
        # the time the seam runs and D-3's create branch never fires here.
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release-assets.sh "${{ steps.ver.outputs.version }}" "${{ github.sha }}"
