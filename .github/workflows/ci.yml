name: CI

# Tests every push and pull request. A tag on a commit of main is also a
# release, and the tag gives the version:
#   git tag v2.0.0-rc.2 && git push origin v2.0.0-rc.2   a prerelease, npm dist-tag next
#   git tag v2.0.0      && git push origin v2.0.0        a release, npm dist-tag latest
# Each job writes the tag's version into package.json and the plugin
# manifests inside the runner; nothing is pushed back. npm trusts this
# workflow file as the package's publisher (trusted publishing through
# OIDC), so no npm token is stored. A failed job is re-run alone: the
# publish and the GitHub Release skip what exists.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs every test. The live suites (real VICE, Ghidra and
      # the native tools) are opt-in and show as skipped, with their reason.
      - name: Test
        run: pnpm test

  installed:
    name: installed package (ubuntu-latest)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A release tag: the package from here on has the tag's version.
      - name: Set the version of the release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node distribution/version.ts tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main. Tag a commit of main." >&2
            exit 1
          fi

      # npm publish drops a manifest field it finds invalid (bin paths that
      # start with ./) and only warns; npm pack keeps them, so the smoke test
      # below cannot see it. The dry run fails for a version that is already
      # published, so only its warning counts.
      - name: Check that npm publishes package.json unchanged
        run: |
          npm publish --dry-run --access public --tag "${{ steps.tag.outputs.channel || 'next' }}" > "$RUNNER_TEMP/publish.log" 2>&1 || true
          if grep -q auto-corrected "$RUNNER_TEMP/publish.log"; then cat "$RUNNER_TEMP/publish.log"; exit 1; fi

      # The install route: the packed package through npx, as users run
      # the published one. No build, no links.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/c64-emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memmap.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -qE 'c64-re-tools@${{ steps.tag.outputs.channel || '(latest|next)' }}"' .mcp.json
          node .claude/skills/c64-memory-map/scripts/memmap.ts at '$d020' | grep -q EXTCOL
          npx -y "$package" c64-re-tools status

  publish:
    needs: [test, installed]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1 or later (trusted publishing)
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@latest
          fi
          npm --version

      - name: Publish
        run: |
          node distribution/version.ts tag "$GITHUB_REF_NAME"
          version="${{ needs.installed.outputs.version }}"
          if [ "$(npm view "@henols/c64-re-tools@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@henols/c64-re-tools@$version is on npm already."
          else
            npm publish --provenance --access public --tag "${{ needs.installed.outputs.channel }}"
          fi

  github-release:
    needs: [installed, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already."
          else
            prerelease=$([ "${{ needs.installed.outputs.channel }}" = next ] && echo --prerelease || true)
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          fi
