name: Release

# Publishes the npm package for a version tag such as v2.0.0, with npm
# provenance. npm trusts this workflow as the package's publisher (trusted
# publishing through OIDC), so no npm token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag names the package and plugin versions
        run: |
          node -e '
            const read = (file) => JSON.parse(require("node:fs").readFileSync(file, "utf8"));
            const marketplace = read(".claude-plugin/marketplace.json");
            const versions = [read("package.json").version, read(".claude-plugin/plugin.json").version, marketplace.version, ...marketplace.plugins.map((plugin) => plugin.version)];
            if (versions.some((version) => "v" + version !== process.env.GITHUB_REF_NAME)) throw new Error("versions " + versions.join(", ") + " do not match " + process.env.GITHUB_REF_NAME);
          '

      - run: pnpm typecheck
      - run: pnpm test

      # npm publish drops a manifest field it finds invalid (bin paths that
      # start with ./) and only warns; npm pack keeps them, so the smoke test
      # below cannot see it. The dry run fails for a version that is already
      # published, so only its warning counts.
      # A prerelease (a version with a hyphen, 2.0.0-rc.1) goes to the dist-tag
      # next, so latest keeps the last release.
      - name: Choose the dist-tag
        run: echo "DIST_TAG=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')" >> "$GITHUB_ENV"

      - name: Check that npm publishes package.json unchanged
        run: |
          npm publish --dry-run --access public --tag "$DIST_TAG" > "$RUNNER_TEMP/publish.log" 2>&1 || true
          if grep -q auto-corrected "$RUNNER_TEMP/publish.log"; then cat "$RUNNER_TEMP/publish.log"; exit 1; fi

      # The packed package through npx, as users run the published one.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/c64-emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memmap.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -qE 'c64-re-tools@(latest|next)"' .mcp.json
          node .claude/skills/c64-memory-map/scripts/memmap.ts at '$d020' | grep -q EXTCOL
          npx -y "$package" c64-re-tools status

      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - name: Publish
        run: npm publish --provenance --access public --tag "$DIST_TAG"
