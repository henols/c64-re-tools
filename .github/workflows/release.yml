name: Release

# Publishes the npm package for a version tag such as v1.0.0, with npm
# provenance. The package stays "private": true until the first release is
# decided; npm refuses to publish it before that changes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm typecheck
      - run: pnpm test

      # The packed package through npx, as users run the published one.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/c64-emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memmap.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -q 'c64-re-tools@latest' .mcp.json
          node .claude/skills/c64-memory-map/scripts/memmap.ts at '$d020' | grep -q EXTCOL
          npx -y "$package" c64-re-tools status

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
