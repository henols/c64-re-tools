name: Release

# Bumps the version, checks the package, commits and tags the bump, and
# publishes it to npm with provenance. Start it from the Actions tab or with
#   gh workflow run release.yml -f bump=prerelease
# A prerelease (a version with a hyphen, 2.0.0-rc.2) goes to the dist-tag
# next, a release to latest. npm trusts this workflow file as the package's
# publisher (trusted publishing through OIDC), so no npm token is stored.
#
# The bump is pushed before the publish. If the publish fails, re-run the
# failed publish job: it publishes the same tag, with no second bump.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "npm version bump. prerelease: 2.0.0-rc.1 -> 2.0.0-rc.2. patch: 2.0.0-rc.2 -> 2.0.0, 2.0.0 -> 2.0.1."
        type: choice
        default: prerelease
        options: [prerelease, patch, minor, major, prepatch, preminor, premajor]

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the bump commit and the tag
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bump the version in package.json and every manifest
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --preid rc --no-git-tag-version
          node distribution/version.ts sync
          node distribution/version.ts check
          version=$(node -p 'require("./package.json").version')
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "The tag v$version exists already. Choose another bump." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DIST_TAG=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')" >> "$GITHUB_ENV"

      - run: pnpm typecheck
      - run: pnpm test

      # npm publish drops a manifest field it finds invalid (bin paths that
      # start with ./) and only warns; npm pack keeps them, so the smoke test
      # below cannot see it.
      - name: Check that npm publishes package.json unchanged
        run: |
          npm publish --dry-run --access public --tag "$DIST_TAG" > "$RUNNER_TEMP/publish.log" 2>&1 || true
          if grep -q auto-corrected "$RUNNER_TEMP/publish.log"; then cat "$RUNNER_TEMP/publish.log"; exit 1; fi

      # The packed package through npx, as users run the published one.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/c64-emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memmap.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -q "c64-re-tools@$DIST_TAG\"" .mcp.json
          node .claude/skills/c64-memory-map/scripts/memmap.ts at '$d020' | grep -q EXTCOL
          npx -y "$package" c64-re-tools status

      # The commit and the tag go together, or neither does.
      - name: Commit and tag the bump
        run: |
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "$version"
          git push --atomic origin HEAD:main "refs/tags/v$version"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - name: Publish
        run: |
          npm --version
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish --provenance --access public --tag "$tag"
