name: Release

# A release is a tag push on a commit of main:
#   git tag v2.0.0-rc.2 && git push origin v2.0.0-rc.2   a prerelease, npm dist-tag next
#   git tag v2.0.0      && git push origin v2.0.0        a release, npm dist-tag latest
# The version comes from the tag only: each job writes it into package.json
# and the plugin manifests inside the runner, and nothing is pushed back.
# npm trusts this workflow file as the package's publisher (trusted
# publishing through OIDC), so no npm token is stored. A failed job is
# re-run alone: the publish and the GitHub Release skip what exists.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set the version of the tag
        id: tag
        run: node distribution/version.ts tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main. Tag a commit of main." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # npm publish drops a manifest field it finds invalid (bin paths that
      # start with ./) and only warns; npm pack keeps them, so the smoke test
      # below cannot see it.
      - name: Check that npm publishes package.json unchanged
        run: |
          npm publish --dry-run --access public --tag "${{ steps.tag.outputs.channel }}" > "$RUNNER_TEMP/publish.log" 2>&1 || true
          if grep -q auto-corrected "$RUNNER_TEMP/publish.log"; then cat "$RUNNER_TEMP/publish.log"; exit 1; fi

      # The packed package through npx, as users run the published one.
      - name: Run the packed programs through npx and install the skills
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package="--package=$(ls "$RUNNER_TEMP"/*.tgz)"
          for program in c64-re-tools c64-re-tools-mcp c64-re-tools-host; do npx -y "$package" "$program" --help > /dev/null; done
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npx -y "$package" c64-re-tools install --target claude
          test -f .claude/skills/c64-emulator/SKILL.md
          test -f .claude/skills/c64-memory-map/scripts/memmap.ts
          test -f .claude/skills/c64-memory-map/package.json
          test -z "$(find . -type l)"
          grep -q 'c64-re-tools@${{ steps.tag.outputs.channel }}"' .mcp.json
          node .claude/skills/c64-memory-map/scripts/memmap.ts at '$d020' | grep -q EXTCOL
          npx -y "$package" c64-re-tools status

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - name: Publish
        run: |
          npm --version
          node distribution/version.ts tag "$GITHUB_REF_NAME"
          version="${{ needs.check.outputs.version }}"
          if [ "$(npm view "@henols/c64-re-tools@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@henols/c64-re-tools@$version is on npm already."
          else
            npm publish --provenance --access public --tag "${{ needs.check.outputs.channel }}"
          fi

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already."
          else
            prerelease=$([ "${{ needs.check.outputs.channel }}" = next ] && echo --prerelease || true)
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          fi
